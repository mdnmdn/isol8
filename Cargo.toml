[workspace]
resolver = "2"
members = [
  "crates/isol8-core",
  "crates/isol8-registry",
  "crates/isol8-cli",
  ".",
]
default-members = ["."]

# Internal crate versions live here ONLY — `_devops/scripts/version.sh bump`
# rewrites `[workspace.package] version` and these three pins together, so a
# release can never ship a facade requiring a version its members don't have.
[workspace.dependencies]
isol8-core = { path = "crates/isol8-core", version = "0.3.0" }
isol8-registry = { path = "crates/isol8-registry", version = "0.3.0" }
isol8-cli = { path = "crates/isol8-cli", version = "0.3.0" }

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mdnmdn/isol8"
authors = ["Marco De Nittis"]

[package]
name = "isol8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight cross-platform isolation sandbox for AI coding agents and CLI tools with custom policies"
authors.workspace = true
default-run = "isol8"

# docs.rs: build every feature so `registry` / `wizard` / `cli` items are visible,
# and enable doc_cfg so each carries its feature badge.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "isol8"
path = "src/lib.rs"

[[bin]]
name = "isol8"
path = "src/bin_shim.rs"
required-features = ["cli"]

[features]
default = ["cli", "registry"]
# Offline registry types + recipe auto-discovery provider.
registry = ["dep:isol8-registry"]
# Cage authoring API (render/apply/drift/bundles) without clap or dialoguer.
wizard = ["registry", "dep:isol8-cli"]
# CLI binary, meta-commands, interactive wizard (implies wizard + registry).
cli = ["wizard", "isol8-cli/clap-cli"]
# Real-sandbox field-test binary (lives in isol8-cli, where its source is).
field-test = ["cli", "isol8-cli/field-test"]

[dependencies]
isol8-core = { workspace = true }
isol8-registry = { workspace = true, optional = true }
isol8-cli = { workspace = true, optional = true }
anyhow = "1"

# Examples only: serializing a DryRun is what a non-Rust host would do.
[dev-dependencies]
serde_json = "1"

# Embedding examples (_docs/embedding.md §9). Built by `just ci` so they cannot rot.
[[example]]
name = "embed_minimal"
path = "examples/embed_minimal.rs"

[[example]]
name = "embed_json"
path = "examples/embed_json.rs"

[[example]]
name = "embed_config"
path = "examples/embed_config.rs"
required-features = ["registry"]

[[example]]
name = "embed_cage"
path = "examples/embed_cage.rs"
required-features = ["registry"]

[[example]]
name = "embed_recipes"
path = "examples/embed_recipes.rs"
required-features = ["registry"]

[[example]]
name = "embed_analyze"
path = "examples/embed_analyze.rs"
required-features = ["registry"]

[[example]]
name = "embed_harness"
path = "examples/embed_harness.rs"
required-features = ["registry"]

[[example]]
name = "embed_wizard"
path = "examples/embed_wizard.rs"
required-features = ["wizard"]
