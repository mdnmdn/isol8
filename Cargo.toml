[workspace]
resolver = "2"
members = [
  "crates/isol8-core",
  "crates/isol8-registry",
  "crates/isol8-cli",
  ".",
]
default-members = ["."]

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/mdnmdn/isol8"
authors = ["Marco De Nittis"]

[package]
name = "isol8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight cross-platform isolation sandbox for AI coding agents and CLI tools with custom policies"
authors.workspace = true
default-run = "isol8"

[lib]
name = "isol8"
path = "src/lib.rs"

[[bin]]
name = "isol8"
path = "src/bin_shim.rs"
required-features = ["cli"]

[[bin]]
name = "isol8-field-test"
path = "crates/isol8-cli/src/bin/isol8-field-test.rs"
required-features = ["field-test"]

[features]
default = ["cli", "registry"]
# Offline registry types + recipe auto-discovery provider.
registry = ["dep:isol8-registry"]
# CLI binary, wizard, meta-commands (implies registry).
cli = ["registry", "dep:isol8-cli"]
# Real-sandbox field-test binary.
field-test = ["cli"]

[dependencies]
isol8-core = { path = "crates/isol8-core", version = "0.2.6" }
isol8-registry = { path = "crates/isol8-registry", version = "0.2.6", optional = true }
isol8-cli = { path = "crates/isol8-cli", version = "0.2.6", optional = true }
anyhow = "1"
