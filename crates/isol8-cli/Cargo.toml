[package]
name = "isol8-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "isol8 CLI library: meta-commands, wizard (binary is the root isol8 package)"
authors.workspace = true

[lib]
name = "isol8_cli"
path = "src/lib.rs"

[features]
default = []
# Argument parsing + interactive prompts (the `isol8` binary needs this).
clap-cli = ["dep:clap", "dep:dialoguer", "dep:serde_yaml"]
# Real-sandbox field tests. Uses isol8-core only — no clap.
field-test = []

[dependencies]
isol8-core = { workspace = true }
isol8-registry = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yaml = { version = "0.9", optional = true }
dialoguer = { version = "0.11", optional = true }
anyhow = "1"
serde_json = "1"
toml_edit = "0.22"

[[bin]]
name = "isol8-field-test"
path = "src/bin/isol8-field-test.rs"
required-features = ["field-test"]
