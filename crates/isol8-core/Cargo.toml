[package]
name = "isol8-core"
version = "0.2.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/mdnmdn/isol8"
description = "isol8 engine: profiles, resolve, home plan, sandbox backends"
authors = ["Marco De Nittis"]
build = "build.rs"

[lib]
name = "isol8_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
nix = { version = "0.31", features = ["sched", "mount", "fs", "user", "signal"] }
enumflags2 = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_System_Threading",
] }
