[package]
name = "isol8-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "isol8 offline recipe/profile registries: sources, cache, lockfile, trust"
authors.workspace = true

[lib]
name = "isol8_registry"
path = "src/lib.rs"

[dependencies]
isol8-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
